# DECAP CMS — contenido editable del sitio
backend:
  name: github
  repo: MPOrtiz/martha-patricia-site
  branch: main

site_url: https://marthapatriciaortiz.com
display_url: https://marthapatriciaortiz.com

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - label: "Beyond the Desk"
    name: "en_movimiento"
    files:
      - label: "Experiencias, ideas y aprendizaje"
        name: "eventos"
        file: "content/en-movimiento.json"
        format: "json"
        fields:
          - { label: "Etiqueta (ES)", name: "eyebrow_es", widget: "string" }
          - { label: "Etiqueta (EN)", name: "eyebrow_en", widget: "string", required: false }
          - { label: "Título de sección (ES)", name: "headline_es", widget: "string" }
          - { label: "Título de sección (EN)", name: "headline_en", widget: "string", required: false }
          - { label: "Introducción (ES)", name: "intro_es", widget: "text" }
          - { label: "Introducción (EN)", name: "intro_en", widget: "text", required: false }
          - label: "Actividades"
            name: "items"
            widget: "list"
            summary: "{{fields.title_es}} — {{fields.year}}"
            collapsed: true
            fields:
              - { label: "Foto", name: "image", widget: "image", required: false, choose_url: false }
              - { label: "Título (ES)", name: "title_es", widget: "string" }
              - { label: "Título (EN)", name: "title_en", widget: "string", required: false }
              - { label: "Tipo / categoría (ES)", name: "type_es", widget: "string", required: false, hint: "Ej. Formación, Comunidad, Conferencia, Workshop" }
              - { label: "Tipo / categoría (EN)", name: "type_en", widget: "string", required: false }
              - { label: "Lugar (ES)", name: "location_es", widget: "string", required: false }
              - { label: "Lugar (EN)", name: "location_en", widget: "string", required: false }
              - { label: "Año", name: "year", widget: "string", required: false }
              - { label: "Descripción (ES)", name: "description_es", widget: "text" }
              - { label: "Descripción (EN)", name: "description_en", widget: "text", required: false }
              - { label: "Enlace opcional", name: "link", widget: "string", required: false }

  - label: "Reseñas aprobadas"
    name: "resenas"
    files:
      - label: "Testimonios del sitio"
        name: "testimonios"
        file: "content/resenas.json"
        format: "json"
        fields:
          - { label: "Etiqueta (ES)", name: "eyebrow_es", widget: "string" }
          - { label: "Etiqueta (EN)", name: "eyebrow_en", widget: "string", required: false }
          - { label: "Título de sección (ES)", name: "headline_es", widget: "string" }
          - { label: "Título de sección (EN)", name: "headline_en", widget: "string", required: false }
          - { label: "Introducción (ES)", name: "intro_es", widget: "text" }
          - { label: "Introducción (EN)", name: "intro_en", widget: "text", required: false }
          - { label: "CTA (ES)", name: "cta_es", widget: "string" }
          - { label: "CTA (EN)", name: "cta_en", widget: "string", required: false }
          - label: "Reseñas publicadas"
            name: "items"
            widget: "list"
            summary: "{{fields.name}} — {{fields.company}}"
            collapsed: true
            fields:
              - { label: "Visible", name: "visible", widget: "boolean", default: true }
              - { label: "Nombre", name: "name", widget: "string" }
              - { label: "Cargo (ES)", name: "role_es", widget: "string", required: false }
              - { label: "Cargo (EN)", name: "role_en", widget: "string", required: false }
              - { label: "Empresa / organización", name: "company", widget: "string", required: false }
              - { label: "Cómo trabajamos juntos (ES)", name: "relationship_es", widget: "string", required: false }
              - { label: "Cómo trabajamos juntos (EN)", name: "relationship_en", widget: "string", required: false }
              - { label: "Reseña (ES)", name: "quote_es", widget: "text" }
              - { label: "Reseña (EN)", name: "quote_en", widget: "text", required: false }
              - { label: "LinkedIn opcional", name: "linkedin", widget: "string", required: false }
