# DECAPH CMS — reemplaza REPO_OWNER/REPO_NAME con tu repositorio de GitHub.
backend:
  name: github
  repo: REPO_OWNER/REPO_NAME
  branch: main

site_url: https://marthapatriciaortiz.com
display_url: https://marthapatriciaortiz.com

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - label: "En movimiento"
    name: "en_movimiento"
    files:
      - label: "Eventos, comunidades y actividades"
        name: "eventos"
        file: "content/en-movimiento.json"
        format: "json"
        fields:
          - { label: "Etiqueta (ES)", name: "eyebrow_es", widget: "string" }
          - { label: "Etiqueta (EN)", name: "eyebrow_en", widget: "string", required: false }
          - { label: "Título de sección (ES)", name: "headline_es", widget: "string" }
          - { label: "Título de sección (EN)", name: "headline_en", widget: "string", required: false }
          - { label: "Introducción (ES)", name: "intro_es", widget: "text" }
          - { label: "Introducción (EN)", name: "intro_en", widget: "text", required: false }
          - label: "Actividades"
            name: "items"
            widget: "list"
            summary: "{{fields.title_es}} — {{fields.year}}"
            collapsed: true
            fields:
              - { label: "Foto", name: "image", widget: "image", required: false, choose_url: false }
              - { label: "Título (ES)", name: "title_es", widget: "string" }
              - { label: "Título (EN)", name: "title_en", widget: "string", required: false }
              - { label: "Tipo / categoría (ES)", name: "type_es", widget: "string", required: false, hint: "Ej. Conferencia, Meetup, Workshop" }
              - { label: "Tipo / categoría (EN)", name: "type_en", widget: "string", required: false }
              - { label: "Lugar (ES)", name: "location_es", widget: "string", required: false }
              - { label: "Lugar (EN)", name: "location_en", widget: "string", required: false }
              - { label: "Año", name: "year", widget: "string", required: false }
              - { label: "Descripción (ES)", name: "description_es", widget: "text" }
              - { label: "Descripción (EN)", name: "description_en", widget: "text", required: false }
              - { label: "Enlace opcional", name: "link", widget: "string", required: false }
