<style>
  :root { --coral:#EF7563; --yellow:#F5C842; --brown:#5B2A1E; --ink:#2E1A14; --muted:#6E4E45; --cream:#FFF7F3; --line:#EAD3CB; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: #F6EDE8; color: var(--ink); font-family: 'Nunito', system-ui, sans-serif; min-height: 100vh; }
  .layout { display: flex; gap: 40px; justify-content: center; align-items: flex-start; padding: 32px 24px; }
  aside { width: 300px; flex: 0 0 300px; position: sticky; top: 24px; display: flex; flex-direction: column; gap: 14px; max-height: calc(100vh - 48px); overflow-y: auto; padding-right: 4px; }
  .brand { background: var(--coral); border-radius: 22px; padding: 18px 18px 16px; border-bottom: 6px solid var(--yellow); }
  .brand h1 { margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 28px; color: #fff; line-height: 1; }
  .brand p { margin: 8px 0 0; font-weight: 800; font-size: 14px; color: #3A140C; }
  .group h2 { margin: 6px 4px 6px; font-size: 12px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); }
  .group ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .group button { width: 100%; text-align: left; min-height: 44px; border: none; border-radius: 14px; background: transparent; padding: 8px 12px; font: 700 14px 'Nunito', sans-serif; color: var(--ink); cursor: pointer; }
  .group button:hover { background: #fff; }
  .group button[aria-current="true"] { background: var(--yellow); color: #3A140C; font-weight: 800; }
  .hint { font-size: 13px; color: var(--muted); font-weight: 600; padding: 0 4px; }
  .stage { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .phone { width: 414px; height: 868px; border-radius: 52px; border: 12px solid #2E1A14; background: #FFF7F3; overflow: hidden; box-shadow: 0 30px 60px rgba(91,42,30,.25); }
  .viewport { width: 390px; height: 844px; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
  .viewport::-webkit-scrollbar { display: none; }
  .caption { font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 18px; color: var(--brown); text-align: center; }
  .nav { display: flex; gap: 10px; }
  .nav button { height: 44px; padding: 0 18px; border-radius: 999px; border: 2px solid var(--brown); background: #fff; color: var(--brown); font: 800 14px 'Nunito', sans-serif; cursor: pointer; }
  .screen a { color: #5B2A1E; } .screen a:hover { color: #2E1A14; }
  .screen button, .screen a, .screen label, .screen input[type=checkbox], .screen input[type=radio] { cursor: pointer; }
  .mobile-bar { display: none; }
  @media (max-width: 820px) {
    .layout { padding: 0; display: block; }
    aside, .caption, .nav { display: none; }
    .mobile-bar { display: flex; position: sticky; top: 0; z-index: 5; gap: 8px; padding: 8px; background: var(--coral); border-bottom: 4px solid var(--yellow); }
    .mobile-bar label { position: absolute; left: -9999px; }
    .mobile-bar select { flex: 1 1 auto; height: 44px; border-radius: 12px; border: none; padding: 0 10px; font: 800 15px 'Nunito', sans-serif; color: var(--ink); background: #fff; }
    .stage { display: block; }
    .phone { width: 100%; height: auto; border: none; border-radius: 0; box-shadow: none; overflow: visible; }
    .viewport { width: 390px; height: auto; overflow: visible; transform-origin: top left; }
  }
</style>

function resolve(expr, scope) {
  const e = expr.trim();
  if (e === 'true') return true;
  if (e === 'false') return false;
  if (e === 'null' || e === 'undefined') return null;
  if (/^-?\d+(\.\d+)?$/.test(e)) return Number(e);
  if (/^(['"]).*\1$/.test(e)) return e.slice(1, -1);
  let v = scope;
  for (const part of e.split('.')) { if (v == null) return undefined; v = v[part]; }
  return v;
}
const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
const WHOLE = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;
function interp(str, scope) {
  return str.replace(HOLE, (_, p) => { const v = resolve(p, scope); return v == null ? '' : String(v); });
}
function holeValue(attr, scope) {
  if (attr == null) return undefined;
  const m = attr.match(WHOLE);
  return m ? resolve(m[1], scope) : attr;
}

function renderNodes(nodes, scope, parent) {
  for (const node of nodes) {
    if (node.nodeType === 3) { parent.appendChild(document.createTextNode(interp(node.nodeValue, scope))); continue; }
    if (node.nodeType !== 1) continue;
    const tag = node.localName;
    if (tag === 'sc-for') {
      const list = holeValue(node.getAttribute('list'), scope) || [];
      const as = node.getAttribute('as') || 'item';
      list.forEach((item, i) => renderNodes(node.childNodes, Object.assign({}, scope, { [as]: item, $index: i }), parent));
      continue;
    }
    if (tag === 'sc-if') {
      if (holeValue(node.getAttribute('value'), scope)) renderNodes(node.childNodes, scope, parent);
      continue;
    }
    const el = node.cloneNode(false);
    for (const attr of Array.from(node.attributes)) {
      const name = attr.name, val = attr.value;
      if (!val.includes('{{')) continue;
      const m = val.match(WHOLE);
      if (m && name.startsWith('on')) {
        el.removeAttribute(name);
        const fn = resolve(m[1], scope);
        if (typeof fn === 'function') el.addEventListener(name.slice(2).toLowerCase(), (ev) => { ev.preventDefault(); fn(ev); });
      } else {
        const out = interp(val, scope);
        el.setAttribute(name, out);
        if (name === 'value' && 'value' in el) el.value = out;
      }
    }
    if (tag === 'a') {
      const href = el.getAttribute('href') || '';
      if (href.endsWith('.dc.html')) {
        const target = href.split('/').pop();
        el.setAttribute('href', '#' + target.replace('.dc.html', ''));
        el.addEventListener('click', (ev) => { ev.preventDefault(); go(target); });
      } else if (href === '#' || href.startsWith('#')) {
        el.addEventListener('click', (ev) => ev.preventDefault());
      }
    }
    if (tag === 'form') el.addEventListener('submit', (ev) => ev.preventDefault());
    renderNodes(node.childNodes, scope, el);
    parent.appendChild(el);
  }
}

function getInstance(s) {
  if (!instances[s.id]) {
    const Component = SCREEN_CODE[s.id](DCLogic);
    const inst = new Component(Object.assign({}, s.props));
    if (!inst.state) inst.state = {};
    instances[s.id] = inst;
  }
  return instances[s.id];
}
function getTemplate(s) {
  if (!templates[s.id]) { const t = document.createElement('template'); t.innerHTML = s.html; templates[s.id] = t; }
  return templates[s.id];
}

function render(resetScroll) {
  const s = SCREENS.find((x) => x.id === current);
  if (!s) return;
  const inst = getInstance(s);
  const vals = inst.renderVals ? inst.renderVals() : {};
  const host = document.getElementById('screen');
  const vp = document.getElementById('viewport');
  const keep = vp.scrollTop, keepWin = window.scrollY;
  host.innerHTML = '';
  renderNodes(getTemplate(s).content.childNodes, vals || {}, host);
  if (resetScroll) { vp.scrollTop = 0; if (window.innerWidth <= 820) window.scrollTo(0, 0); }
  else { vp.scrollTop = keep; window.scrollTo(0, keepWin); }
  fitMobile();
}

function go(id) {
  if (!SCREENS.some((x) => x.id === id)) id = SCREENS[0].id;
  current = id;
  const s = SCREENS.find((x) => x.id === id);
  document.getElementById('caption').textContent = s.title;
  document.querySelectorAll('#menu button').forEach((b) => b.setAttribute('aria-current', b.dataset.id === id ? 'true' : 'false'));
  document.getElementById('picker').value = id;
  try {
    const h = '#' + id.replace('.dc.html', '');
    if (location.hash !== h) history.replaceState(null, '', h);
  } catch (e) { /* vista previa sin historial: se ignora */ }
  render(true);
}

function fitMobile() {
  const vp = document.getElementById('viewport');
  if (window.innerWidth <= 820) {
    const scale = Math.min(1, window.innerWidth / 390);
    vp.style.transform = scale < 1 ? 'scale(' + scale + ')' : '';
    vp.style.marginLeft = scale < 1 ? '0' : 'auto';
    vp.style.marginRight = scale < 1 ? '0' : 'auto';
    document.querySelector('.phone').style.height = scale < 1 ? (vp.scrollHeight * scale) + 'px' : 'auto';
  } else {
    vp.style.transform = ''; vp.style.margin = ''; document.querySelector('.phone').style.height = '';
  }
}

function buildMenu() {
  const menu = document.getElementById('menu');
  const picker = document.getElementById('picker');
  const groups = [];
  for (const s of SCREENS) {
    let g = groups.find((x) => x.name === s.group);
    if (!g) { g = { name: s.group, items: [] }; groups.push(g); }
    g.items.push(s);
  }
  for (const g of groups) {
    const wrap = document.createElement('div'); wrap.className = 'group';
    const h = document.createElement('h2'); h.textContent = g.name; wrap.appendChild(h);
    const ol = document.createElement('ol');
    const og = document.createElement('optgroup'); og.label = g.name;
    for (const s of g.items) {
      const li = document.createElement('li');
      const b = document.createElement('button'); b.type = 'button'; b.dataset.id = s.id; b.textContent = s.title;
      b.addEventListener('click', () => go(s.id));
      li.appendChild(b); ol.appendChild(li);
      const o = document.createElement('option'); o.value = s.id; o.textContent = s.title; og.appendChild(o);
    }
    wrap.appendChild(ol); menu.appendChild(wrap); picker.appendChild(og);
  }
  picker.addEventListener('change', () => go(picker.value));
  const step = (d) => { const i = SCREENS.findIndex((x) => x.id === current); go(SCREENS[(i + d + SCREENS.length) % SCREENS.length].id); };
  document.getElementById('prev').addEventListener('click', () => step(-1));
  document.getElementById('next').addEventListener('click', () => step(1));
}

buildMenu();
window.addEventListener('resize', fitMobile);
window.addEventListener('hashchange', () => { const id = location.hash.slice(1) + '.dc.html'; if (id !== current) go(id); });
let startId = SCREENS[0].id;
try { if (location.hash) startId = location.hash.slice(1) + '.dc.html'; } catch (e) {}
try { go(startId); } catch (e) {
  document.getElementById('screen').innerHTML = '<p style="padding:24px;font-weight:700">No se pudo mostrar la pantalla: ' + String(e.message || e).replace(/</g, '&lt;') + '</p>';
}
</script>
