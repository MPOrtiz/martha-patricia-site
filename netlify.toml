[build]
  publish = "."
  # Genera content/clientes.json con los logos que haya en /clientes
  command = "node scripts/build-clientes.js"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
