[build]
  publish = "."
  # Genera content/clientes.json (logos de /clientes) y las páginas de /entregables
  command = "node scripts/build-clientes.js && node scripts/build-entregables.js"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Entregables para clientes: fuera de buscadores y sin caché larga
[[headers]]
  for = "/entregables/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    Referrer-Policy = "same-origin"
