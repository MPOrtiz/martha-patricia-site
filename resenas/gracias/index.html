<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gracias — Martha Patricia Ortiz</title><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#050607;color:#fff;font-family:Manrope,sans-serif;padding:28px}.card{max-width:680px;background:#0C0F14;border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:48px;box-shadow:0 24px 70px rgba(0,0,0,.35)}.ey{font-family:'JetBrains Mono',monospace;font-size:.72rem;letter-spacing:.16em;color:#D4E71F;font-weight:700;margin-bottom:16px}.card h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(2.2rem,6vw,3.6rem);line-height:1.05;margin:0 0 18px}.card p{color:#A7B0C2;line-height:1.7;font-size:1.02rem}.btn{display:inline-block;margin-top:20px;background:#D4E71F;color:#0B132B;text-decoration:none;padding:12px 18px;border-radius:8px;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.82rem}@media(max-width:600px){.card{padding:32px 26px}}</style></head><body><main class="card"><div class="ey">GRACIAS</div><h1>Gracias por compartir tu experiencia.</h1><p>Recibí tu reseña. La revisaré antes de publicarla y únicamente aparecerá en el sitio si cuenta con tu autorización.</p><a class="btn" href="/">Volver al inicio →</a></main></body></html>
